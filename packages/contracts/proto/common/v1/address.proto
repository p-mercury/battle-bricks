syntax = "proto3";
package common.v1;

import "buf/validate/validate.proto";

option go_package = "contracts/dist/common/v1;common";

message Address {
  string region_code = 1 [
    (buf.validate.field).string.max_len = 2,
    (buf.validate.field).string.pattern = "^[A-Z]+$"
  ];

  repeated string address_lines = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 5
    items: {
      string: {max_len: 200}
    }
  }];

  optional string postal_code = 3 [(buf.validate.field).string.max_len = 20];

  optional string language_code = 4 [(buf.validate.field).string.max_len = 35];

  optional string sorting_code = 5 [(buf.validate.field).string.max_len = 20];

  optional string administrative_area = 6 [(buf.validate.field).string.max_len = 100];

  optional string locality = 7 [(buf.validate.field).string.max_len = 100];

  optional string sublocality = 8 [(buf.validate.field).string.max_len = 100];
}
