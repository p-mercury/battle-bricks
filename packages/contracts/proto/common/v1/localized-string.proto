syntax = "proto3";
package common.v1;

import "buf/validate/validate.proto";
import "common/v1/language.proto";

option go_package = "contracts/dist/common/v1;common";

message LocalizedString {
  repeated Translation translations = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 20
    },
    (buf.validate.field).cel = {
      id: "unique_languages"
      message: "languages must be unique"
      expression: "this.all(t, this.filter(i, i.language == t.language).size() == 1)"
    }
  ];
}

message Translation {
  Language language = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string value = 2 [(buf.validate.field).string.min_len = 1];
}
