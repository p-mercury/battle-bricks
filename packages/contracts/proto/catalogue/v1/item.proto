syntax = "proto3";
package catalogue.v1;

import "catalogue/v1/range.proto";
import "common/v1/dice-roll.proto";

option go_package = "contracts/dist/catalogue/v1;catalogue";

message Item {
  string name = 1;
  optional string description = 2;
  uint32 price = 3;

  oneof details {
    Blaster blaster = 4;
    BlasterBolt blaster_bolt = 5;
    Cannon cannon = 6;
    CannonShell cannon_shell = 7;
    Launcher launcher = 8;
    LauncherRocket launcher_rocket = 9;
    MeleeWeapon melee_weapon = 10;
  }
}

message Blaster {
  Range range = 1;
  uint32 fire_rate = 2;
}

message Cannon {
  Range range = 1;
  uint32 fire_rate = 2;
}

message Launcher {
  uint32 fire_rate = 1;
}

message MeleeWeapon {
  uint32 attack_speed = 1;
  uint32 armor_piercing = 2;
  common.v1.DiceRoll damage = 3;
}

message BlasterBolt {
  uint32 capacity = 1;
  uint32 armor_piercing = 2;
  common.v1.DiceRoll damage = 3;
}

message CannonShell {
  uint32 splash_radius = 1;
  uint32 armor_piercing = 2;
  common.v1.DiceRoll damage = 3;
}

message LauncherRocket {
  Range range = 1;
  uint32 precision = 2;
  uint32 armor_piercing = 3;
  uint32 splash_radius = 4;
  common.v1.DiceRoll damage = 5;
}
