syntax = "proto3";
package catalogue.v1;

import "catalogue/v1/range.proto";
import "common/v1/dice-roll.proto";

option go_package = "contracts/dist/catalogue/v1;catalogue";

message Item {
  string id = 1;
  uint64 version = 2;

  string name = 3;
  optional string description = 4;
  uint32 price = 5;

  oneof details {
    Blaster blaster = 6;
    BlasterBolt blaster_bolt = 7;
    Cannon cannon = 8;
    CannonShell cannon_shell = 9;
    Launcher launcher = 10;
    LauncherRocket launcher_rocket = 11;
    MeleeWeapon melee_weapon = 12;
  }
}

message Blaster {
  Range range = 1;
  uint32 fire_rate = 2;
}

message Cannon {
  Range range = 1;
  uint32 fire_rate = 2;
}

message Launcher {
  uint32 fire_rate = 1;
}

message MeleeWeapon {
  uint32 attack_speed = 1;
  uint32 armor_piercing = 2;
  common.v1.DiceRoll damage = 3;
}

message BlasterBolt {
  uint32 capacity = 1;
  uint32 armor_piercing = 2;
  common.v1.DiceRoll damage = 3;
}

message CannonShell {
  uint32 splash_radius = 1;
  uint32 armor_piercing = 2;
  common.v1.DiceRoll damage = 3;
}

message LauncherRocket {
  Range range = 1;
  uint32 precision = 2;
  uint32 armor_piercing = 3;
  uint32 splash_radius = 4;
  common.v1.DiceRoll damage = 5;
}
