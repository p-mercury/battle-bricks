syntax = "proto3";
package catalogue.v1;

import "catalogue/v1/item.proto";
import "catalogue/v1/unit.proto";

option go_package = "contracts/dist/catalogue/v1;catalogue";

message Loadout {
  string id = 1;
  uint64 version = 2;

  optional string image = 3;
  string name = 4;
  optional string description = 5;
  Unit unit = 6;
  repeated Item items = 7;
}
