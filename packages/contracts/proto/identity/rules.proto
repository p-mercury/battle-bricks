syntax = "proto2";
package identity;

import "buf/validate/validate.proto";

option go_package = "contracts/dist/identity;identity";

extend buf.validate.StringRules {
  optional bool user_id = 81000000 [(buf.validate.predefined).cel = {
    id: "string.identity_customer_user_id"
    message: "Must be a customer user ID"
    expression: "this.matches('^c-[0-9A-Za-z]{12}$')"
  }];
  optional bool user_name = 81000002 [(buf.validate.predefined).cel = {
    id: "string.identity_customer_user_name"
    message: "Must be a customer user name"
    expression: "this.matches('^[\\\\p{L}\\\\p{N}&._-][\\\\p{L}\\\\p{N} &._-]{0,78}[\\\\p{L}\\\\p{N}&._-]$')"
  }];
  optional bool organisation_id = 81000001 [(buf.validate.predefined).cel = {
    id: "string.identity_customer_organisation_id"
    message: "Must be a customer organisation ID"
    expression: "this.matches('^[0-9A-Za-z]{12}$')"
  }];
  optional bool organisation_name = 81000003 [(buf.validate.predefined).cel = {
    id: "string.identity_customer_organisation_name"
    message: "Must be a customer organisation name"
    expression: "this.matches('^[\\\\p{L}\\\\p{N}.-][\\\\p{L}\\\\p{N} .-]{0,78}[\\\\p{L}\\\\p{N}.-]$')"
  }];
}
