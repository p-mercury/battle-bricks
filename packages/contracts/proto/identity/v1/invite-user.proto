syntax = "proto3";
package identity.v1;

import "buf/validate/validate.proto";
import "common/v1/correlation.proto";
import "identity/rules.proto";
import "identity/v1/user.proto";

option go_package = "contracts/dist/identity/v1;identity";

message InviteUserRequest {
  repeated common.v1.Correlation correlations = 1 [(buf.validate.field).repeated = {max_items: 20}];

  string organisation_id = 2 [(buf.validate.field).string.(identity.organisation_id) = true];

  string email_address = 3 [(buf.validate.field).string.email = true];
}

message InviteUserResponse {
  User user = 1;
}

message InviteUserContext {
  InviteUserRequest request = 1;
}
