syntax = "proto3";
package identity.v1;

import "common/v1/correlation.proto";
import "common/v1/language.proto";
import "google/protobuf/timestamp.proto";
import "identity/v1/user-notification-settings.proto";
import "identity/v1/user-status.proto";

option go_package = "contracts/dist/identity/v1;identity";

message User {
  string id = 1;
  repeated common.v1.Correlation correlations = 2;
  uint64 version = 3;
  google.protobuf.Timestamp created_time = 4;
  google.protobuf.Timestamp modified_time = 5;

  string organisation_id = 6;
  string email_address = 7;
  UserStatus status = 8;
  string name = 9;
  optional string job_title = 10;
  optional string image = 11;
  common.v1.Language language = 12;
  UserNotificationSettings notification_settings = 13;
}
