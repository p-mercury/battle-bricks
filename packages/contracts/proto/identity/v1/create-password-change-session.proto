syntax = "proto3";
package identity.v1;

import "buf/validate/validate.proto";
import "identity/rules.proto";
import "identity/v1/password-change-session.proto";
import "identity/v1/user.proto";

option go_package = "contracts/dist/identity/v1;identity";

message CreatePasswordChangeSessionRequest {
  optional string id = 1 [(buf.validate.field).string.(identity.user_id) = true];
}

message CreatePasswordChangeSessionResponse {
  PasswordChangeSession session = 1;
}

message CreatePasswordChangeSessionContext {
  CreatePasswordChangeSessionRequest request = 1;
  User subject = 2;
}
