syntax = "proto3";
package identity.v1;

import "buf/validate/validate.proto";
import "common/v1/correlation.proto";
import "common/v1/language.proto";
import "filestaging/rules.proto";
import "identity/rules.proto";
import "identity/v1/user-notification-settings.proto";
import "identity/v1/user-status.proto";
import "identity/v1/user.proto";

option go_package = "contracts/dist/identity/v1;identity";

message UpdateUserRequest {
  string id = 1 [(buf.validate.field).string.(identity.user_id) = true];

  // The resource version the client expects to update.
  // When provided, the update succeeds only if it matches the current product version.
  // When omitted, the update is performed without optimistic concurrency checking.
  optional uint64 version = 2;

  repeated string update_mask = 3 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {
      string: {
        in: [
          "correlations",
          "email_address",
          "image",
          "name",
          "job_title",
          "status",
          "language",
          "notification_settings"
        ]
      }
    }
  }];

  repeated common.v1.Correlation correlations = 4 [(buf.validate.field).repeated = {max_items: 20}];

  optional string email_address = 5 [(buf.validate.field).string.email = true];

  optional string image = 6 [(buf.validate.field).string.(filestaging.file_id) = true];

  optional string name = 7 [(buf.validate.field).string.(identity.user_name) = true];

  optional string job_title = 8 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 80,
    (buf.validate.field).string.pattern = "^[A-Za-z ]*$"
  ];

  optional UserStatus status = 9 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [
      0,
      1,
      2
    ]
  }];

  optional common.v1.Language language = 10 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  UserNotificationSettings notification_settings = 11;
}

message UpdateUserResponse {
  User user = 1;
}

message UpdateUserContext {
  UpdateUserRequest request = 1;
  User subject = 2;
}
