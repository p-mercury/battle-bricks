  - "./apps/cdk/*"
  - "./apps/cdk/services/*"
  - "./packages/*"
shamefullyHoist: true
allowBuilds:
  "@bufbuild/buf": true
  "@parcel/watcher": false
  "@sentry/cli": false
  esbuild: false
minimumReleaseAgeExclude:
