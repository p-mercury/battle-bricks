  - "@ai-sdk/openai@4.0.37"
  - "@ai-sdk/provider-utils@5.0.26"
  - "@aws-cdk/aws-lambda-go-alpha@2.264.0-alpha.0"
  - ai@7.0.59
  - aws-cdk-lib@2.264.0
